# config/prompts.yml

# ------------------------------------------
# 0) Instruction‐key “types” telling PromptBuilder how to interpret each key
# ------------------------------------------
instructions_detail:
  boolean:
    - multipage_value
    - multiline_value
    - single
    - include_bbox
  list:
    - search_keys
    - anchor_phrases
    - region_hint
    - contact_fields
    - entity_type
  option:
    scope:
      - whole
      - section
      - pages
      - fields
      - extraction_items
      - single_value
      - multi_value
      - address_block
      - currency
      - identifier
      - number
      - date
      - email
      - signature_block
      - contact
      - person
      - organization
      - support
      - billing

# ------------------------------------------
# 1) Common system prompt (insert schema via {schema})
# ------------------------------------------
system: |
  You are a document-extraction agent. You must produce exactly one JSON object that
  fully conforms to the following JSON schema (no extra keys, no extra output):

  {schema}

# ------------------------------------------
# 2) Common user‐prompt postfix
# ------------------------------------------
postfix: |
  Output only the JSON object; do NOT output any extra text or explanation.

# ------------------------------------------
# 3) Base templates for each extraction type (no page references)
# ------------------------------------------
user:
  key_value: |
    Now: extract the field "{field_name}" (description: {description}).
    Previous value: "{prev_value}"
    {instruction}
    {postfix}

  bullet_points: |
    • A "bullet point" is a top-level list item, usually introduced by a dash (–, -, •) or numbering.
    • Extract only parent-level bullets. Do NOT treat indented or nested sub-points as separate entries:
      – If a parent bullet has nested lines (for example, "- vehicles including:" followed by sub-lines), 
        combine those sub-lines into the parent bullet’s single "value".
      – Maintain the order as it appears in the document. Assign “point_number” incrementally for each parent item.
    • Example snippet from the PDF:
        Contents we don’t insure
        We don't insure any of these items under Contents Insurance:
        loose or unset gemstones
        plants, trees or shrubs growing in the ground
        grass, rocks and soil on your site
        building materials or items at your site that are due to be fitted to your home (we provide limited cover for those items under Buildings Insurance — see page 38)
        animals
        the cost to replace any credit or financial transaction cards
        illegal items — this includes illegally downloaded digital media
        goods kept for sale, distribution, on display, exhibition or on consignment
        stock used in any business, trade or profession
        watercraft except for sailboards, canoes, kayaks, and non-motorised surf skis
        trailers, caravans, aircraft or aerial devices
        vehicles including:
        - motor vehicles
        - any registrable motorcycles
        - any motorcycles greater than 75cc
        - ride-on vehicles (for example, motorised golf buggies or carts) except for mobility scooters and ride-on lawnmowers that you only use to mow your lawn.
    • In this example:
      – The parent bullet “vehicles including:” should capture “vehicles including: motor vehicles, any registrable motorcycles, …” as one "value".
      – Do NOT output separate entries for “motor vehicles” or “any registrable motorcycles”; they are part of the parent bullet.
    • If no bullet points are found on the specified pages, return an empty list for "points".
    Now: extract all bullet points for
    {{
      field_name : {field_name},
      description: {description}
    }}
    {instruction}
    {postfix}

  summarization: |
    Now: summarize the requested content for field "{field_name}".
    Description: {description}
    {instruction}
    {postfix}

  summary: |
    Now: summarize the requested content for field "{field_name}".
    Description: {description}
    {instruction}
    {postfix}

  checkbox: |
    Now: extract the checkbox selection(s) for "{field_name}" (description: {description}). 
    In the image checked boexes marked blue and unchecked boxes are marked green in color for easier identification.
    So you will need to extract text only coresponding to the blues.
    {instruction}
    {postfix}

  table: |
    Extract the table relevant for field_name = "{field_name}".
    - Use the description to help you locate, identify, and disambiguate the correct table: "{description}".
    - The description may specify where to find the table, what it contains, or how to identify it among multiple tables.
    - Return the table as a dict json object exactly as the schema having field_name, rows and continue_next_page.
    - rows will be a list where each entry will have row_number and cols which will be a list where each entry will have col_number numbered in increasing order.
    - Always merge adjacent text fragments that belong to the same cell (e.g., line-wrapped descriptions) into a single cell value.
    - If search_keys are provided in the config, use them to locate the relevant section of the document.
    - if the table is completely present in the page then output continue_next_page as false else ture
    - Output format: JSON array of row objects, each with a page_number field.
    {instruction}
    {postfix}

  entity_block: |
    Identify the visually prominent text block requested for "{field_name}" (description: {description}).
    Prior extracted content: "{prev_value}"
    Focus on cohesive text blocks rather than scattered words.
    {instruction}
    {postfix}

fallback: |
  Extract the field "{field_name}" (description: {description}) as {extraction_type}.
  Previous value: "{prev_value}"
  {instruction}
  {postfix}

# ------------------------------------------
# 4) Instruction fragments, organized by type
#    Every entry is now an object with "vars" and "prompt" for symmetry.
# ------------------------------------------
instructions:
  generic:
    search_keys:
      vars: ["search_keys"]
      prompt: |
        • "search_keys" are one or more short phrases or headings you supply in your DE config.
          They help the model locate the correct section(s) or page(s) in the document by embedding similarity.
          Example: ["Contents we don’t insure", "Contents Not Insured"] will bias retrieval toward that heading.
        • If none of these exact phrases appear verbatim, the model will attempt a semantic match:
          – It looks for pages whose content is semantically similar to ANY of the search_keys.
          – If no strong match is found, it falls back to embedding the combination of field_name + description.
        • If you leave "search_keys" empty or omit it entirely, then:
          search_keys for this extraction_item = {search_keys}
    anchor_phrases:
      vars: ["anchor_phrases"]
      prompt: |
        • Use these nearby phrases as anchors to locate the correct region of the page:
        {anchor_phrases}
    region_hint:
      vars: ["region_hint"]
      prompt: |
        • Region hints supplied (in priority order):
        {region_hint}
        • Allowed values and guidance:
            header        → top band of the page (roughly top 20%).
            footer        → bottom band (roughly bottom 20%).
            left/right    → left or right vertical halves.
            center        → middle column of the page.
            top_left/top_right/bottom_left/bottom_right → page quadrants.
        • When multiple hints are present, scan the regions in the order listed before inspecting other areas.

  key_value:
    multipage_value:
      vars: []
      prompt: |
        • This field may span multiple pages. On each page:
          – If you find (part of) the value, include it in the JSON output and set `"continue_next_page": true`.
          – If it’s the final fragment (no more pages remain), set `"continue_next_page": false`.
        • If that field is absent on a given page, set `"value": ""` and `"post_processing_value": null`, then `"continue_next_page": false`.
        • **Note:** The JSON keys follow the schema injected by the system prompt (KeyValueOutput).

    multiline_value:
      vars: []
      prompt: |
        • This field may contain multiple lines but will not span across pages.
        • Capture the entire block of text, preserving line breaks in `"value"`.
        • Always set `"continue_next_page": false` (single-page).
        • If that multi-line block is not found, set `"value": ""`, `"post_processing_value": null`, and `"continue_next_page": false`.

    single:
      vars: []
      prompt: |
        • This field is strictly single-page and single-line.
        • Always set `"continue_next_page": false`.
        • If not found on that page, set `"value": ""`, `"post_processing_value": null`, and `"continue_next_page": false`.
    address_block:
      vars: []
      prompt: |
        • Extract the complete mailing address block, preserving line order (street, city, state, postal code, country).
        • Do not omit apartment or suite numbers; include punctuation as printed.
    currency:
      vars: []
      prompt: |
        • Return the monetary amount including currency symbol or ISO code.
        • Normalise thousands separators and decimal points as they appear.
    identifier:
      vars: []
      prompt: |
        • Capture the exact identifier (policy number, invoice number, reference ID) without extra words.
        • Preserve formatting such as hyphens, slashes, or mixed case.
    number:
      vars: []
      prompt: |
        • Extract the numeric value only, stripping descriptive text.
        • Preserve decimal precision; do not round.
    date:
      vars: []
      prompt: |
        • Extract the date and normalise it to YYYY-MM-DD if possible.
        • If the document shows multiple date formats, choose the one closest to the field description.
    email:
      vars: []
      prompt: |
        • Extract the email address and ensure it matches a valid pattern (local@domain).
        • If multiple addresses appear, select the one most relevant to the description unless instructed otherwise.
    signature_block:
      vars: []
      prompt: |
        • Capture the signer’s name, title, and date/time if present.
        • Include any signature cues such as “Signed by” or “Authorised representative”.

  bullet_points:
    multipage_value:
      vars: []
      prompt: |
        • If bullet-points span multiple pages, set `"continue_next_page": true` on intermediate pages and `"continue_next_page": false` on the last page.
        • If no bullets are found on a page, return `"points": []` and `"continue_next_page": false`.
        • **Note:** The bullets must follow the BulletPointsOutput schema injected by the system prompt.

  entity_block:
    include_bbox:
      vars: []
      prompt: |
        • Include a bounding box for the extracted block with coordinates (x1,y1,x2,y2) in page pixels.
    entity_type:
      vars: ["entity_type"]
      prompt: |
        • Target entity categories: {entity_type}.
          Use these cues to decide whether the block is a company name, person name, address masthead, etc.
    address_block:
      vars: []
      prompt: |
        • Extract the full address block exactly as laid out (line-by-line, no reordering).
    currency:
      vars: []
      prompt: |
        • Identify the currency amount or rate shown in the highlighted block, including symbol.
    identifier:
      vars: []
      prompt: |
        • Return the identifier exactly as printed (e.g., invoice number, policy number, claim ID).
    number:
      vars: []
      prompt: |
        • Extract the numeric value and keep its original formatting (commas, decimals).
    date:
      vars: []
      prompt: |
        • Provide the date in the block and normalise to YYYY-MM-DD where feasible.
    email:
      vars: []
      prompt: |
        • Locate any email addresses inside the block; ensure they are validly formatted.
    signature_block:
      vars: []
      prompt: |
        • Capture signer details (name, title, date) from the block; highlight signature cues if present.
    contact:
      vars: []
      prompt: |
        • Treat this as a contact information block: gather name, role, phone, email, address, and related details.
        • Preserve natural ordering and keep related fields grouped together.
    contact_fields:
      vars: ["contact_fields"]
      prompt: |
        • Populate the following contact sub-fields when present (use empty strings if missing):
        {contact_fields}
    person:
      vars: []
      prompt: |
        • Emphasise personal contact details: full name, title, and direct communication channels (phone/email).
    organization:
      vars: []
      prompt: |
        • Emphasise organisation-level details: company name, department, and general contact channels.
    support:
      vars: []
      prompt: |
        • Highlight support-related channels such as help desk numbers or support email addresses.
    billing:
      vars: []
      prompt: |
        • Emphasise billing/finance contacts: accounts receivable email, billing phone, payment address.

  table:
    columns:
      vars: ["columns"]
      prompt: |
        - Use the following columns if specified:
        {columns}
    header_row:
      vars: []
      prompt: |
        • The table has a header row. If column names are not provided in the config, use the header row to infer column names.
    merge_adjacent:
      vars: []
      prompt: |
        • Merge adjacent text fragments that logically belong to the same cell (e.g., line-broken descriptions) when assembling row values.
  summary:
    whole:
      vars: []
      prompt: |
        • Summarize the entire document from start to finish, combining all relevant information.
        • If the document has multiple sections or chapters, provide a coherent overview covering the main points of each.
        • If no relevant content is found (e.g., an empty PDF), set `"summary": ""`.

    section:
      vars: ["section_name"]
      prompt: |
        • Summarize only the named section: "{section_name}".
        • Identify pages containing the exact heading "{section_name}". If search_keys are provided, use them to confirm you’re in the right section.
        • Extract text/images from those pages and craft a concise summary focused solely on that section’s content.
        • If the section is not present or contains no substantive text, set `"summary": ""`.

    pages:
      vars: ["probable_pages"]
      prompt: |
        • Summarize exactly the specified pages: {probable_pages}.
        • Concatenate text/images from these pages in order, then produce one combined summary of that chunk.
        • If any specified pages are missing or lack extractable text, ignore them and still summarize what remains.
        • If none of the specified pages yield content, set `"summary": ""`.


  checkbox:
    single_value:
      vars: []
      prompt: |
        • This checkbox expects exactly one selection.
        • Return a JSON object with keys matching the CheckboxOutput schema:
          – `"field_name"`: the logical field name
          – `"selected_options"`: a single-element array containing the chosen value (or `[]` if none)
          – `"continue_next_page"`: `true` or `false` depending on whether more pages remain

    multi_value:
      vars: []
      prompt: |
        • This checkbox allows multiple selections.
        • Return a JSON object with keys matching the CheckboxOutput schema:
          – `"field_name"`: the logical field name
          – `"selected_options"`: a list of chosen values (or `[]` if none)
          – `"continue_next_page"`: `true` or `false` depending on whether more pages remain
